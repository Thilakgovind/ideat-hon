<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metro</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',system-ui,sans-serif;color:#24132F}
a{color:#5B1F96}a:hover{color:#FF4F8B}
button{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F7FF; display: flex; flex-direction: column; overflow: hidden">
  <div style="position: relative">
    <img src="../assets/travel_metro.gif" alt="Animated metro train with AVAL waving" style="width: 390px; height: 210px; object-fit: cover; display: block">
    <a href="Home.html" aria-label="Back" style="position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24132F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0; margin-top: -26px; background: #F4F7FF; border-radius: 26px 26px 0 0; position: relative">
    <div style="display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 800">Metro</span><span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 14px; color: #5D6A88">மெட்ரோ</span></div>

    <!-- next train -->
    <div style="background: #1F5BDA; border-radius: 22px; padding: 16px 18px; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; opacity: 0.8">NEXT TRAIN FROM KOYAMBEDU</span>
        <span style="font-size: 15px; font-weight: 600">Towards Nungambakkam</span>
        <div style="display: flex; gap: 6px; margin-top: 4px">
          <span style="background: rgba(255,255,255,0.18); font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px">Platform 2</span>
          <span style="background: #FF4F8B; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px">Women: front coach</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 48px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">4</span><span style="font-size: 13px; opacity: 0.85">min</span></div>
    </div>

    <!-- stations timeline -->
    <div style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 0; border: 1.5px solid #DCE4F7">
      <div style="display: flex; gap: 12px; align-items: center; min-height: 44px">
        <span style="width: 16px; height: 16px; border-radius: 8px; border: 4px solid #1F5BDA; box-sizing: border-box; background: #FFFFFF"></span>
        <span style="flex: 1; font-size: 15px; font-weight: 800">Koyambedu</span><span style="font-size: 12px; color: #5D6A88">8:12</span></div>
      <div style="display: flex; gap: 12px; align-items: center; min-height: 36px"><span style="width: 16px; display: flex; justify-content: center"><span style="width: 4px; height: 36px; background: #1F5BDA"></span></span><span style="font-size: 13px; color: #5D6A88">3 stops · 11 min · lift at both ends</span></div>
      <div style="display: flex; gap: 12px; align-items: center; min-height: 44px">
        <span style="width: 16px; height: 16px; border-radius: 8px; background: #FF4F8B"></span>
        <span style="flex: 1; font-size: 15px; font-weight: 800">Nungambakkam</span><span style="font-size: 12px; color: #5D6A88">8:23</span></div>
      <div style="display: flex; gap: 8px; margin-top: 8px; background: #F4F7FF; border-radius: 12px; padding: 8px 10px; font-size: 12px; color: #2E3A59">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F5BDA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3v18M5 10l7-7 7 7"/></svg>Use exit B: closest to the school gate</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; border: 1.5px solid #DCE4F7"><span style="font-size: 11px; color: #5D6A88">Fare</span><span style="font-size: 18px; font-weight: 800">₹30</span></div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; border: 1.5px solid #DCE4F7"><span style="font-size: 11px; color: #5D6A88">Crowd</span><span style="font-size: 18px; font-weight: 800; color: #0B7F74">Low</span></div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; align-items: center; border: 1.5px solid #DCE4F7"><span style="font-size: 11px; color: #5D6A88">Remind me</span><span style="font-size: 14px; font-weight: 800">2 stops before</span></div>
    </div>
    <span style="font-size: 11px; color: #5D6A88; text-align: center">Sample data for demo</span>
  </div>

  <div style="padding: 10px 16px 22px">
    <a href="Payment.html" style="height: 56px; border-radius: 16px; background: #1F5BDA; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Book ticket · ₹30</a>
  </div>
</div>


</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome and login</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;700&family=Noto+Serif+Tamil:wght@800&display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',system-ui,sans-serif;color:#24132F}
a{color:#5B1F96}a:hover{color:#FF4F8B}
button,input{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden">
  <div style="position: relative; height: 380px; background: linear-gradient(160deg, #5B1F96 0%, #8A2FC2 55%, #FF4F8B 100%); border-radius: 0 0 40px 40px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 18px; box-sizing: border-box">
    <div style="position: absolute; top: 22px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; gap: 6px"><span style="width: 22px; height: 6px; border-radius: 3px; background: #FFFFFF"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #FFFFFF; opacity: 0.5"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #FFFFFF; opacity: 0.5"></span></div>
      <a href="Home.html" style="color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 4px">Skip</a>
    </div>
    <img src="../assets/pose_wave.png" alt="AVAL waving hello" style="width: 196px; height: 256px; object-fit: contain">
    <span style="color: #FFFFFF; font-size: 38px; font-weight: 800; letter-spacing: -0.01em; line-height: 1">SafePath</span>
    <span style="font-family: 'Noto Serif Tamil', serif; color: #FFE1EC; font-size: 18px; font-weight: 800; margin-top: 4px">சேஃப்பாத்</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 22px 22px 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 22px; font-weight: 800; line-height: 1.25">Travel freely. AVAL has your back.</span>
      <span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 15px; color: #6A5878">பயமின்றி பயணியுங்கள். அவள் உங்களுடன்.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6A5878">Language · மொழி</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="height: 52px; border-radius: 16px; border: 2px solid #5B1F96; background: #5B1F96; color: #FFFFFF; font-size: 17px; font-weight: 700; font-family: 'Noto Sans Tamil', sans-serif">தமிழ்</button>
        <button style="height: 52px; border-radius: 16px; border: 2px solid #EADCF1; background: #FFFFFF; color: #24132F; font-size: 17px; font-weight: 700">English</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="phone" style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6A5878">Mobile number</label>
      <div style="display: flex; align-items: center; height: 56px; border-radius: 16px; background: #FFFFFF; border: 2px solid #EADCF1; padding: 0 16px; gap: 10px">
        <span style="font-weight: 700; font-size: 16px">+91</span><span style="width: 1px; height: 24px; background: #EADCF1"></span>
        <input id="phone" value="98765 43210" style="border: none; outline: none; flex: 1; min-width: 0; font-size: 17px; font-weight: 600; color: #24132F; background: transparent; letter-spacing: 0.04em">
      </div>
    </div>

    <a href="Home.html" style="height: 56px; border-radius: 16px; background: #FF4F8B; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 8px 20px rgba(255,79,139,0.3)">Send OTP
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>

    <div style="display: flex; gap: 10px; align-items: flex-start; background: #F3E8FA; border-radius: 14px; padding: 12px 14px; margin-top: auto">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0FA596" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      <span style="font-size: 13px; line-height: 1.45; color: #4A3A58">We never track you in the background. Location is shared only during a trip or SOS.</span>
    </div>
  </div>
</div>


</body>
</html>

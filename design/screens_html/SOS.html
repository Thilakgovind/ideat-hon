<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOS</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',system-ui,sans-serif;color:#24132F}
a{color:#B3122A}a:hover{color:#24132F}
button{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF4F4; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 0">
    <a href="LiveTrip.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#24132F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <span style="font-size: 13px; font-weight: 700; color: #B3122A; background: #FFE1E4; padding: 6px 12px; border-radius: 999px">Silent mode on</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 20px 0; text-align: center">
    <span style="font-size: 24px; font-weight: 800">Need help?</span>
    <span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 15px; color: #6A5878">உதவி தேவையா?</span>
  </div>

  <!-- big button -->
  <div style="display: flex; justify-content: center; padding: 22px 0 12px">
    <button aria-label="Hold for 2 seconds to send SOS" style="width: 220px; height: 220px; border-radius: 110px; border: none; background: radial-gradient(circle at 50% 40%, #FF4A5F, #D11A33); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 0 0 18px #FFE1E4, 0 0 0 36px #FFF0F1">
      <span style="font-size: 48px; font-weight: 900; letter-spacing: 0.04em">SOS</span>
      <span style="font-size: 14px; font-weight: 700; opacity: 0.95">Hold 2 seconds</span>
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 18px 16px 0">
    <div style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; border: 1.5px solid #F5D3D8">
      <span style="font-size: 13px; font-weight: 800; color: #6A5878; letter-spacing: 0.06em">WHEN YOU HOLD, AVAL WILL</span>
      <div style="display: flex; gap: 8px; align-items: center; font-size: 14px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFE1E4; color: #B3122A; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</span>Alert Amma and Kavya by SMS</div>
      <div style="display: flex; gap: 8px; align-items: center; font-size: 14px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFE1E4; color: #B3122A; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>Share your live location until you stop it</div>
      <div style="display: flex; gap: 8px; align-items: center; font-size: 14px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFE1E4; color: #B3122A; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">3</span>Show the nearest open shop and police booth</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px; border: 1.5px solid #F5D3D8">
        <span style="font-size: 12px; color: #6A5878">Women helpline</span><span style="font-size: 28px; font-weight: 900; color: #B3122A; user-select: all">181</span></div>
      <div style="background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px; border: 1.5px solid #F5D3D8">
        <span style="font-size: 12px; color: #6A5878">Police</span><span style="font-size: 28px; font-weight: 900; color: #B3122A; user-select: all">100</span></div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: #E2F7F3; border-radius: 18px; padding: 10px 12px">
      <img src="../assets/aval_face_alert.png" alt="AVAL, serious" style="width: 44px; height: 44px">
      <span style="flex: 1; font-size: 13px; line-height: 1.4; color: #24524E">Nearest help: police booth 180 m · Lakshmi kiosk 50 m (open)</span>
    </div>
  </div>

  <div style="padding: 12px 16px 22px">
    <a href="Home.html" style="height: 54px; border-radius: 16px; border: 2px solid #0FA596; color: #0B7F74; background: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">I'm safe now</a>
  </div>
</div>


</body>
</html>

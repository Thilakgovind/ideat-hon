<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',system-ui,sans-serif;color:#24132F}
a{color:#5B1F96}a:hover{color:#FF4F8B}
button{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 18px 16px 6px">
    <a href="Booking.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24132F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span style="font-size: 20px; font-weight: 800">Pay for your trip</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 6px 16px 0">
    <!-- summary -->
    <div style="background: linear-gradient(140deg, #5B1F96, #8A2FC2); border-radius: 24px; padding: 18px; color: #FFFFFF; display: flex; gap: 8px; align-items: center; position: relative; overflow: hidden">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; opacity: 0.8">YOUR TRIP · TODAY 8:00</span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">Anna Nagar West</span><span style="font-size: 13px; opacity: 0.8">to Nungambakkam</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">
          <div style="display: flex; justify-content: space-between"><span>Bus 70</span><span style="font-weight: 800; color: #9DF5DC">FREE</span></div>
          <div style="display: flex; justify-content: space-between"><span>Metro · Koyambedu → Nungambakkam</span><span style="font-weight: 700">₹30</span></div>
        </div>
      </div>
      <img src="../assets/feature_pay.png" alt="AVAL holding a coin" style="width: 96px; height: 126px; object-fit: contain; flex: none; margin-right: -10px">
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
      <span style="font-size: 15px; color: #6A5878">Total to pay</span><span style="font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums">₹30</span>
    </div>

    <!-- UPI -->
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6A5878">Pay with UPI</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <button style="height: 84px; border-radius: 18px; border: 2.5px solid #5B1F96; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; color: #24132F"><span style="width: 36px; height: 36px; border-radius: 12px; background: #E8F0FE; color: #1F5BDA; font-weight: 900; display: flex; align-items: center; justify-content: center">G</span>GPay</button>
        <button style="height: 84px; border-radius: 18px; border: 1.5px solid #EADCF1; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; color: #24132F"><span style="width: 36px; height: 36px; border-radius: 12px; background: #F1E6FD; color: #5B1F96; font-weight: 900; display: flex; align-items: center; justify-content: center">P</span>PhonePe</button>
        <button style="height: 84px; border-radius: 18px; border: 1.5px solid #EADCF1; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; color: #24132F"><span style="width: 36px; height: 36px; border-radius: 12px; background: #E3F5FD; color: #0A78B8; font-weight: 900; display: flex; align-items: center; justify-content: center">₱</span>Paytm</button>
        <button style="height: 84px; border-radius: 18px; border: 1.5px solid #EADCF1; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700; color: #24132F"><span style="width: 36px; height: 36px; border-radius: 12px; background: #FFF1DE; color: #C26A00; font-weight: 900; display: flex; align-items: center; justify-content: center">@</span>UPI ID</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #6A5878">Other ways</span>
      <button style="height: 56px; border-radius: 16px; border: 1.5px solid #EADCF1; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 15px; font-weight: 600; color: #24132F">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B1F96" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>Debit / credit card</button>
      <button style="height: 56px; border-radius: 16px; border: 1.5px solid #EADCF1; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 15px; font-weight: 600; color: #24132F">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B1F96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4z"/><path d="M4 7l3-3h10l3 3M8 12h8"/></svg>Metro travel card</button>
    </div>
  </div>

  <div style="padding: 12px 16px 22px; display: flex; flex-direction: column; gap: 10px; align-items: center">
    <a href="Ticket.html" style="width: 100%; height: 58px; border-radius: 16px; background: #FF4F8B; color: #FFFFFF; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 8px 20px rgba(255,79,139,0.3)">Pay ₹30 with GPay</a>
    <span style="font-size: 12px; color: #6A5878; display: flex; align-items: center; gap: 6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0FA596" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Secured by Razorpay · the free bus leg costs nothing</span>
  </div>
</div>


</body>
</html>

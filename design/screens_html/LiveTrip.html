<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live trip</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',system-ui,sans-serif;color:#F4EEF8}
a{color:#FF8FB6}a:hover{color:#FFFFFF}
button{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1A1424; position: relative; overflow: hidden">
  <!-- road scene -->
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
    <defs>
      <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B1C44"/><stop offset=".45" stop-color="#6B2F6E"/><stop offset=".62" stop-color="#E77B7B"/></linearGradient>
      <linearGradient id="lane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2EE6A8" stop-opacity="0"/><stop offset="1" stop-color="#2EE6A8" stop-opacity=".75"/></linearGradient>
    </defs>
    <rect width="390" height="844" fill="url(#dusk)"/>
    <g fill="#22182F">
      <rect x="0" y="250" width="60" height="220"/><rect x="58" y="300" width="44" height="170"/><rect x="290" y="230" width="64" height="240"/><rect x="350" y="290" width="40" height="180"/><rect x="230" y="330" width="44" height="140"/><rect x="120" y="350" width="36" height="120"/>
    </g>
    <g fill="#FFD27A" opacity=".7"><rect x="12" y="280" width="8" height="8"/><rect x="30" y="310" width="8" height="8"/><rect x="304" y="260" width="8" height="8"/><rect x="326" y="300" width="8" height="8"/><rect x="300" y="350" width="8" height="8"/><rect x="70" y="330" width="8" height="8"/></g>
    <path d="M150 470 L240 470 L420 844 L-30 844 Z" fill="#2A2232"/>
    <path d="M190 470 L200 470 L230 844 L160 844 Z" fill="url(#lane)"/>
    <g stroke="#FFFFFF" stroke-opacity=".6" stroke-width="4" stroke-dasharray="24 30"><path d="M168 470 L60 844"/><path d="M222 470 L330 844"/></g>
    <g fill="#2EE6A8">
      <path d="M195 560 l-16 18 l16 -6 l16 6 z" opacity=".55"/>
      <path d="M195 620 l-24 26 l24 -9 l24 9 z" opacity=".75"/>
      <path d="M195 700 l-34 38 l34 -13 l34 13 z"/>
    </g>
    <g><circle cx="300" cy="540" r="5" fill="#FF6B6B"/><circle cx="280" cy="520" r="4" fill="#FF6B6B"/><circle cx="90" cy="560" r="5" fill="#FFF0B3"/></g>
  </svg>

  <!-- top step card -->
  <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 18px; font-weight: 800">On your trip</span>
      <a href="Home.html" style="height: 36px; padding: 0 14px; border-radius: 999px; background: #2EE6A8; color: #14111B; font-size: 13px; font-weight: 800; display: flex; align-items: center; text-decoration: none">Minimise</a>
    </div>
    <div style="background: rgba(26,20,36,0.82); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 14px; display: flex; gap: 12px; align-items: center">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: #FF4F8B; color: #FFFFFF; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center">Walk</span>
      <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; opacity: 0.75">Main road · busy and lit</span><span style="font-size: 17px; font-weight: 800">Next open shop: pharmacy, 120 m</span></div>
      <img src="../assets/aval_face_smile.png" alt="AVAL" style="width: 44px; height: 44px; border-radius: 22px; background: #F3E8FA"></div>
    <div style="align-self: flex-start; display: flex; align-items: center; gap: 8px; background: rgba(26,20,36,0.82); border-radius: 999px; padding: 6px 12px 6px 6px">
      <span style="width: 26px; height: 26px; border-radius: 13px; background: #FF4F8B; color: #FFFFFF; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center">A</span>
      <span style="font-size: 12px; font-weight: 700">Kavya is 80 m away · Amma watching</span>
    </div>
  </div>

  <!-- AVAL guiding -->
  <div style="position: absolute; right: 8px; top: 360px; display: flex; flex-direction: column; align-items: center">
    <span style="background: #FFFFFF; color: #24132F; font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 12px; margin-bottom: 4px">Straight on</span>
    <img src="../assets/pose_guide.png" alt="AVAL pointing the way" style="width: 82px; height: 108px; object-fit: contain"></div>

  <!-- bottom panel -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #F7F2FA; color: #24132F; border-radius: 28px 28px 0 0; padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 12px">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D6C8E2"></span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center">
      <div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #6A5878">Distance left</span><span style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums">700 m</span></div>
      <div style="display: flex; flex-direction: column; border-left: 1px solid #EADCF1; border-right: 1px solid #EADCF1"><span style="font-size: 12px; color: #6A5878">Reach by</span><span style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums">9:52</span></div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #6A5878">Check-in</span><span style="font-size: 18px; font-weight: 800; color: #0B7F74">On</span></div>
    </div>
    <div style="height: 8px; border-radius: 4px; background: #EADCF1; overflow: hidden"><div style="width: 62%; height: 8px; background: linear-gradient(90deg, #0FA596, #2EE6A8)"></div></div>
    <div style="display: grid; grid-template-columns: 1fr 76px; gap: 10px">
      <a href="Ticket.html" style="height: 56px; border-radius: 16px; background: #0FA596; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">I've reached</a>
      <a href="SOS.html" aria-label="SOS" style="height: 56px; border-radius: 16px; background: #E3263F; color: #FFFFFF; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; text-decoration: none">SOS</a>
    </div>
  </div>
</div>


</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Free bus tracker</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',system-ui,sans-serif;color:#24132F}
a{color:#5B1F96}a:hover{color:#FF4F8B}
button{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7EC; display: flex; flex-direction: column; overflow: hidden">
  <div style="position: relative">
    <img src="../assets/travel_bus.gif" alt="Animated free bus with AVAL waving" style="width: 390px; height: 220px; object-fit: cover; display: block">
    <a href="Home.html" aria-label="Back" style="position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#24132F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0; margin-top: -26px; background: #FFF7EC; border-radius: 26px 26px 0 0; position: relative">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 800">Free bus tracker</span><span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 14px; color: #6A5878">இலவச பேருந்து</span></div>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #0B7F74"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2EE6A8"></span>Live</span>
    </div>

    <button style="height: 52px; border-radius: 16px; border: 1.5px solid #EADCF1; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #24132F">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF4F8B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span style="flex: 1; text-align: left; font-size: 15px; font-weight: 700">Anna Nagar West stop</span>
      <span style="font-size: 13px; color: #5B1F96; font-weight: 700">Change</span></button>

    <div style="display: flex; gap: 8px">
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #FF4F8B; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center">Free only</span>
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #EADCF1; font-size: 13px; font-weight: 600; display: flex; align-items: center">All buses</span>
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #EADCF1; font-size: 13px; font-weight: 600; display: flex; align-items: center">Saved stops</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="Booking.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 12px 14px; border: 2px solid #FF4F8B; text-decoration: none; color: #24132F">
        <span style="width: 54px; height: 44px; border-radius: 12px; background: #FF4F8B; color: #FFFFFF; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center">21G</span>
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">to Nungambakkam</span><span style="font-size: 12px; color: #6A5878">Moderate crowd · FREE</span></div>
        <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 22px; font-weight: 800; color: #DB3570">6</span><span style="font-size: 11px; color: #6A5878; margin-top: -4px">min</span></div></a>
      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 12px 14px; border: 1.5px solid #EADCF1">
        <span style="width: 54px; height: 44px; border-radius: 12px; background: #FF4F8B; color: #FFFFFF; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center">70</span>
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">to Koyambedu</span><span style="font-size: 12px; color: #6A5878">Usually crowded at 8am · FREE</span></div>
        <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 22px; font-weight: 800">9</span><span style="font-size: 11px; color: #6A5878; margin-top: -4px">min</span></div></div>
      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 12px 14px; border: 1.5px solid #EADCF1">
        <span style="width: 54px; height: 44px; border-radius: 12px; background: #FF4F8B; color: #FFFFFF; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center">5D</span>
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">to T. Nagar</span><span style="font-size: 12px; color: #6A5878">Light crowd · FREE</span></div>
        <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 22px; font-weight: 800">14</span><span style="font-size: 11px; color: #6A5878; margin-top: -4px">min</span></div></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #E2F7F3; border-radius: 18px; padding: 10px 12px">
      <img src="../assets/feature_shops.png" alt="" style="width: 48px; height: 62px; object-fit: contain">
      <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 800; color: #0B5F59">Wait safely: Lakshmi SHG kiosk</span><span style="font-size: 12px; color: #24524E">50 m · women-run · open till 9 pm</span></div>
      <a href="Nearby.html" style="font-size: 13px; font-weight: 800; color: #0B5F59; text-decoration: none; padding: 10px 4px">Map</a>
    </div>
    <span style="font-size: 11px; color: #6A5878; text-align: center">Sample data for demo</span>
  </div>
</div>


</body>
</html>
